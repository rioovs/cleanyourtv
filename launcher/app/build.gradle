plugins {
    id 'com.android.application'
}

// The camera server for the CCTV cards, read from local.properties (never committed: that file is
// in .gitignore). Without the three keys the CCTV feature is off and no camera is contacted.
//   cctv.host=192.168.1.50
//   cctv.user=name
//   cctv.pass=secret
def cctv = new Properties()
def cctvFile = rootProject.file('local.properties')
if (cctvFile.exists()) {
    cctvFile.withInputStream { cctv.load(it) }
}
def cctvHost = (cctv.getProperty('cctv.host') ?: '').trim()
def cctvUser = (cctv.getProperty('cctv.user') ?: '').trim()
def cctvPass = cctv.getProperty('cctv.pass') ?: ''

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '2.6'
        // The camera address and its login are build-time values from local.properties, so nothing
        // secret is in the repository. They end up in the APK, which is only ever sideloaded.
        resValue 'string', 'cctv_host', cctvHost
        resValue 'string', 'cctv_user', cctvUser
        resValue 'string', 'cctv_pass', cctvPass
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
